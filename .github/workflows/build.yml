# Builds Ashstrap on GitHub's Windows machines, so nothing has to be installed or run locally.
# Result: an "Ashstrap-win-x64" download on the workflow run's page (Actions tab).
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet run --project tests/Ashstrap.Core.Tests -c Release

      - name: Publish launcher
        run: dotnet publish src/Ashstrap/Ashstrap.csproj -c Release -r win-x64 -o publish

      - name: Publish cleanup helper
        run: dotnet publish src/Ashstrap.CleanupHelper/Ashstrap.CleanupHelper.csproj -c Release -r win-x64 -o publish

      # Opens every screen of both apps on a real Windows machine, renders it, and exits.
      # Read-only: nothing is installed or uninstalled on the build machine.
      - name: Smoke test launcher UI
        shell: pwsh
        timeout-minutes: 3
        run: |
          $log = "$env:RUNNER_TEMP\launcher-smoke.log"
          $p = Start-Process publish\Ashstrap.exe -ArgumentList '--smoke-test', $log -PassThru -Wait
          if (Test-Path $log) { Get-Content $log }
          if (Test-Path "$env:TEMP\Ashstrap-crash.log") { Get-Content "$env:TEMP\Ashstrap-crash.log" }
          if ($p.ExitCode -ne 0) { throw "Launcher smoke test failed (exit $($p.ExitCode))" }

      - name: Smoke test cleanup helper UI
        shell: pwsh
        timeout-minutes: 3
        run: |
          $log = "$env:RUNNER_TEMP\helper-smoke.log"
          $p = Start-Process publish\Ashstrap.CleanupHelper.exe -ArgumentList '--smoke-test', $log -PassThru -Wait
          if (Test-Path $log) { Get-Content $log }
          if (Test-Path "$env:TEMP\Ashstrap-crash.log") { Get-Content "$env:TEMP\Ashstrap-crash.log" }
          if ($p.ExitCode -ne 0) { throw "Helper smoke test failed (exit $($p.ExitCode))" }

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: Ashstrap-win-x64
          path: |
            publish/*.exe
            publish/*_cor3.dll
          if-no-files-found: error
